 <text x="811" y="195" fill="#657B9A">02</text><text x="857" y="195" fill="#78DDF4">focus:</text><text x="929" y="195" fill="#A2E8A3">'impact',</text>
 <text x="811" y="230" fill="#657B9A">03</text><text x="857" y="230" fill="#78DDF4">stack:</text><text x="929" y="230" fill="#A2E8A3">'full-stack',</text>
