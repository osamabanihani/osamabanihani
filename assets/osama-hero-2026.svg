<text x="133" y="281" font-family="Verdana,Arial,sans-serif" font-size="19" font-weight="600" fill="#ADBEDE" letter-spacing="1.3">FULL-STACK SOFTWARE DEVELOPER</text>
<text x="60" y="320" font-family="Verdana,Arial,sans-serif" font-size="16" fill="#93A6C7">Building thoughtful experiences across web, mobile &amp; backend.</text>
