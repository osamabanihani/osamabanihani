<text x="56" y="180" font-family="Verdana,Arial,sans-serif" font-size="64" font-weight="800" letter-spacing="1" fill="#F4F8FF">OSAMA</text>
<text x="57" y="250" font-family="Verdana,Arial,sans-serif" font-size="64" font-weight="800" letter-spacing="1" fill="#F4F8FF">BANIHANI</text>
