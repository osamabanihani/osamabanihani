<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Osama Banihani - Full Stack Developer animated banner">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071126"/><stop offset=".53" stop-color="#0A1935"/><stop offset="1" stop-color="#100D2B"/></linearGradient>
  <radialGradient id="a"><stop stop-color="#19c5f5" stop-opacity=".28"/><stop offset="1" stop-color="#19c5f5" stop-opacity="0"/></radialGradient>
  <radialGradient id="b"><stop stop-color="#9268ed" stop-opacity=".27"/><stop offset="1" stop-color="#9268ed" stop-opacity="0"/></radialGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#41DAFB"/><stop offset="1" stop-color="#9E82FF"/></linearGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#D7E4FF" stroke-opacity=".055"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<style>
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes float2{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
@keyframes pulse{0%,100%{opacity:.40}50%{opacity:.94}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes scan{0%{transform:translateX(-90px)}100%{transform:translateX(1000px)}}
.window{animation:float 7s ease-in-out infinite;transform-origin:center}
.phone{animation:float2 6s ease-in-out infinite;transform-origin:center}
.pulse{animation:pulse 3s ease-in-out infinite}
.cursor{animation:blink 1s steps(1) infinite}
.scan{animation:scan 12s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="430" rx="24" fill="url(#bg)"/>
<circle cx="230" cy="60" r="360" fill="url(#a)"/><circle cx="1030" cy="380" r="360" fill="url(#b)"/>
<rect width="1200" height="430" rx="24" fill="url(#grid)"/>
<path d="M30 345H650" stroke="url(#line)" stroke-opacity=".6" stroke-width="1.5"/><path class="scan" d="M0 345H130" stroke="#45E8FF" stroke-width="2.5" opacity=".55" filter="url(#glow)"/>
<g opacity=".55"><circle cx="62" cy="50" r="4" fill="#54DBFF"/><circle cx="78" cy="50" r="4" fill="#8078FF"/><circle cx="94" cy="50" r="4" fill="#2B496D"/><path d="M108 50H230" stroke="#476484" stroke-width="2"/></g>
