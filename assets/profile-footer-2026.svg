<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-label="End of Osama's profile">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#08162F"/><stop offset=".5" stop-color="#0E1A3B"/><stop offset="1" stop-color="#171032"/></linearGradient><linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#44DBF9"/><stop offset="1" stop-color="#9D83FF"/></linearGradient></defs>
<style>@keyframes dash{to{stroke-dashoffset:-80}}@keyframes glow{50%{opacity:.25}}.wave{animation:dash 7s linear infinite}.dot{animation:glow 4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="1200" height="140" rx="19" fill="url(#bg)"/>
